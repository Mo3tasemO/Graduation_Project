name: mindspeak_flutter
description: Lightweight Flutter frontend for the MindSpeak graduation project.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_blue_plus: 2.3.15
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  http: ^1.2.2
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/mindspeak_logo_navy.png
    - assets/images/mindspeak_logo_transparent_navy.png
